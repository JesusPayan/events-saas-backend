# Eventos SaaS — Opción A: un servidor con Docker Compose + MySQL administrado.
# Uso:  docker compose --env-file env/stack.env up -d
# Entorno de staging: misma definición con otro env/stack.env (otro dominio, BD y credenciales MP de prueba).
name: ${STACK_NAME:-eventos}

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?define DOMAIN en env/stack.env}
      ACME_EMAIL: ${ACME_EMAIL:?define ACME_EMAIL en env/stack.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:?define FRONTEND_IMAGE}:${RELEASE_TAG:?define RELEASE_TAG}
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://backend:5000
    depends_on:
      backend:
        condition: service_healthy

  backend:
    image: ${BACKEND_IMAGE:?define BACKEND_IMAGE}:${RELEASE_TAG}
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-env/backend.env}
    environment:
      FLASK_ENV: production
      # Caddy -> nginx (frontend) -> backend
      TRUSTED_PROXY_COUNT: "2"
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      UPLOAD_FOLDER_PROD: /data/uploads
    volumes:
      - uploads:/data/uploads
      # Certificado CA de la base administrada (p. ej. Linode): env/certs/db-ca.pem
      - ./env/certs:/etc/eventos/certs:ro
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  uploads: {}
  caddy_data: {}
  caddy_config: {}
