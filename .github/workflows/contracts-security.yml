
name: Contracts Security Tests

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  contracts-security:
    name: Contract security regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
          python -m pip check

      - name: Verify pytest installation
        run: |
          python -m pytest --version

      - name: Run contract security tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest \
            tests/test_contract_document_integrity.py \
            tests/test_contract_document_api_security.py \
            tests/test_contract_document_auth.py \
            tests/test_contract_protection.py \
            -v
